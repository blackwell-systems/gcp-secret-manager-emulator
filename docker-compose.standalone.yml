services:
  secret-manager:
    image: ghcr.io/blackwell-systems/gcp-secret-manager-emulator-dual:latest
    ports:
      - "9090:9090"
      - "8080:8080"
    # Persistence is opt-in and off by default. To keep secrets across
    # `docker compose down/up`, uncomment the lines below (secrets are written as
    # plaintext JSON to the volume — local/CI use only):
    # environment:
    #   - GCP_MOCK_PERSIST=true
    # volumes:
    #   - secret-data:/data

# volumes:
#   secret-data:
