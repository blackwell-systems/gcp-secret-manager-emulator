pre_mortem:
    overall_risk: low
    rows:
        - scenario: Agent B test for PermissionDenied requires IAM emulator setup in tests
          likelihood: medium
          impact: medium
          mitigation: |
            Agent B should check existing test patterns for IAM mode configuration.
            If no IAM test infrastructure exists, the agent can mock the iamClient
            field directly on the Server struct or use a test helper.
        - scenario: README already has prerequisites from prior audit agent
          likelihood: medium
          impact: low
          mitigation: |
            Agent C is instructed to check before adding. If prerequisites already
            exist, skip that sub-task.
        - scenario: API-REFERENCE.md TOC links have anchor mismatches
          likelihood: low
          impact: low
          mitigation: |
            Use standard GitHub markdown anchor generation rules (lowercase,
            hyphens for spaces, strip special chars). Test by visual inspection.
