      - id: C
        task: |-
          ## Agent C — Fix storage coverage tests asserting wrong behavior

          File: `internal/server/storage_coverage_test.go`

          Fix tests that currently assert incorrect (pre-fix) behavior. Also update
          `TestParseStateFilter` to match the new (map, error) signature of parseStateFilter.

          ### Fix 1: TestStorage_DestroySecretVersion_Coverage/Idempotent (BUG-1)

          The `Idempotent` subtest currently expects the second destroy to succeed.
          After Agent A's fix, it should return FailedPrecondition. Change the subtest:

          ```go
          t.Run("Idempotent", func(t *testing.T) {
              // Destroy once — should succeed
              resp, err := storage.DestroySecretVersion(ctx, secretName+"/versions/1")
              if err != nil {
                  t.Fatalf("first DestroySecretVersion() failed: %v", err)
              }
              if resp.State != secretmanagerpb.SecretVersion_DESTROYED {
                  t.Errorf("State = %v, want DESTROYED", resp.State)
              }

              // Destroy again — GCP returns FailedPrecondition, not success
              _, err = storage.DestroySecretVersion(ctx, secretName+"/versions/1")
              if err == nil {
                  t.Fatal("second DestroySecretVersion() should return FailedPrecondition, got nil")
              }
              st, ok := status.FromError(err)
              if !ok || st.Code() != codes.FailedPrecondition {
                  t.Errorf("second DestroySecretVersion() error code = %v, want FailedPrecondition", st.Code())
              }
          })
          ```

          ### Fix 2: TestStorage_DisableSecretVersion_Coverage/DisableAlreadyDisabledVersion (GAP-10)

          The `DisableAlreadyDisabledVersion` subtest currently expects success on double-disable.
          After Agent A's fix, it should return FailedPrecondition. Change the subtest:

          ```go
          t.Run("DisableAlreadyDisabledVersion", func(t *testing.T) {
              _, err := storage.AddSecretVersion(ctx, secretName, &secretmanagerpb.SecretPayload{Data: []byte("v2")})
              if err != nil {
                  t.Fatalf("AddSecretVersion() failed: %v", err)
              }

              _, err = storage.DisableSecretVersion(ctx, secretName+"/versions/2")
              if err != nil {
                  t.Fatalf("first DisableSecretVersion() failed: %v", err)
              }

              // Disabling again should return FailedPrecondition
              _, err = storage.DisableSecretVersion(ctx, secretName+"/versions/2")
              if err == nil {
                  t.Fatal("second DisableSecretVersion() should return FailedPrecondition, got nil")
              }
              st, ok := status.FromError(err)
              if !ok || st.Code() != codes.FailedPrecondition {
                  t.Errorf("second DisableSecretVersion() error code = %v, want FailedPrecondition", st.Code())
              }
          })
          ```

          ### Fix 3: TestStorage_EnableSecretVersion_Coverage/EnableAlreadyEnabledVersion (GAP-11)

          The `EnableAlreadyEnabledVersion` subtest currently expects success. After Agent A's
          fix it should return FailedPrecondition. Change the subtest:

          ```go
          t.Run("EnableAlreadyEnabledVersion", func(t *testing.T) {
              _, err := storage.AddSecretVersion(ctx, secretName, &secretmanagerpb.SecretPayload{Data: []byte("v2")})
              if err != nil {
                  t.Fatalf("AddSecretVersion() failed: %v", err)
              }

              // Version 2 is already ENABLED; enabling again should return FailedPrecondition
              _, err = storage.EnableSecretVersion(ctx, secretName+"/versions/2")
              if err == nil {
                  t.Fatal("EnableSecretVersion() on already-enabled version should return FailedPrecondition, got nil")
              }
              st, ok := status.FromError(err)
              if !ok || st.Code() != codes.FailedPrecondition {
                  t.Errorf("EnableSecretVersion() error code = %v, want FailedPrecondition", st.Code())
              }
          })
          ```

          ### Fix 4: TestParseStateFilter — update for new (map, error) signature

          `parseStateFilter` now returns `(map[...State]bool, error)`. Update the test
          function `TestParseStateFilter` to call it correctly and assert error behavior.

          The test helper function needs to receive both return values. Update each
          subtest that calls `parseStateFilter` to use:
          ```go
          result, err := parseStateFilter(tt.filter)
          ```

          For the `InvalidState` case (filter `"state:UNKNOWN"`), update to expect an error:
          ```go
          {
              name:      "InvalidState",
              filter:    "state:UNKNOWN",
              wantErr:   true,
              wantCode:  codes.InvalidArgument,
          },
          ```

          For the `NonStatePrefix` case (filter `"name:something"`), it still returns
          `(nil, nil)` — no change to expected behavior, just update the call site.

          Restructure the test table to include `wantErr bool` and `wantCode codes.Code`
          fields. In the test loop:
          ```go
          result, err := parseStateFilter(tt.filter)
          if tt.wantErr {
              if err == nil {
                  t.Fatalf("parseStateFilter(%q) expected error, got nil", tt.filter)
              }
              st, ok := status.FromError(err)
              if !ok || st.Code() != tt.wantCode {
                  t.Errorf("parseStateFilter(%q) error code = %v, want %v", tt.filter, st.Code(), tt.wantCode)
              }
              return
          }
          if err != nil {
              t.Fatalf("parseStateFilter(%q) unexpected error: %v", tt.filter, err)
          }
          // rest of existing assertions on result...
          ```

          Also update `TestStorage_GetSecretVersion_Coverage/LatestSkipsDisabledVersions`
