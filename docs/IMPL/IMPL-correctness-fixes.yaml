interface_contracts:
  - name: parseStateFilter
    description: |-
      Changed from returning map only to returning (map, error).
      Returns an error for any unrecognized state token so callers can
      return InvalidArgument instead of silently returning 0 results.
    definition: |-
      func parseStateFilter(filter string) (map[secretmanagerpb.SecretVersion_State]bool, error)

      // Valid state tokens: ENABLED, DISABLED, DESTROYED (case-insensitive).
      // Returns (nil, nil) for empty filter string.
      // Returns (map, nil) for valid state: filter.
      // Returns (nil, status.Errorf(codes.InvalidArgument, ...)) for invalid token.
      // For non-state: prefixed filters (e.g., "name:foo"), return (nil, nil) — pass-through.
    location: internal/server/storage.go

  - name: resolveLatestVersionAny
    description: |-
      New function alongside existing resolveLatestVersion.
      Finds the highest-numbered version regardless of state (ENABLED, DISABLED, DESTROYED).
      Used by GetSecretVersion("latest") per GCP semantics.
      The existing resolveLatestVersion remains for AccessSecretVersion (ENABLED-only).
    definition: |-
      func (s *Storage) resolveLatestVersionAny(stored *StoredSecret) (string, error)

      // Must be called with read lock held.
      // Returns the highest version number string (e.g., "3") regardless of state.
      // Returns codes.NotFound only when stored.Versions is empty (zero versions exist).
      // Uses found bool flag (not 0-sentinel) to detect "no versions at all".
    location: internal/server/storage.go

  - name: resolveLatestVersion (updated)
    description: |-
      Existing function updated to fix BUG-6 (0-sentinel bug) and GAP-13
      (FailedPrecondition vs NotFound distinction).
      Signature unchanged. Now uses found bool flag instead of latestVersionNum==0 sentinel.
      Returns FailedPrecondition when versions exist but none are ENABLED.
      Returns NotFound only when no versions exist at all.
    definition: |-
      func (s *Storage) resolveLatestVersion(stored *StoredSecret) (string, error)

      // Must be called with read lock held.
      // Returns codes.NotFound when len(stored.Versions) == 0.
      // Returns codes.FailedPrecondition when versions exist but none are ENABLED.
      // Uses: var found bool; only set found=true when Sscanf succeeds and state==ENABLED.
      // Skip (continue) on Sscanf parse error instead of silently using num=0.
    location: internal/server/storage.go

  - name: NewServer (gateway)
    description: |-
      BUG-5 fix: signature changes from returning *Server (panicking on error)
      to returning (*Server, error). All callers must handle the error.
    definition: |-
      func NewServer(grpcAddr string) (*Server, error)

      // Returns (*Server, nil) on success.
      // Returns (nil, fmt.Errorf("failed to dial gRPC server: %w", err)) on grpc.NewClient failure.
      // Never panics.
    location: internal/gateway/gateway.go

  - name: grpcStatusToHTTP
    description: |-
      New package-level helper in gateway.go that maps gRPC status codes to HTTP status codes.
      Used by all handler functions instead of hardcoded http.StatusInternalServerError.
    definition: |-
      func grpcStatusToHTTP(err error) int

      // Mapping:
      //   codes.NotFound          -> 404
      //   codes.AlreadyExists     -> 409
      //   codes.InvalidArgument   -> 400
      //   codes.FailedPrecondition -> 400
      //   codes.PermissionDenied  -> 403
      //   codes.Unauthenticated   -> 401
      //   default (including codes.Internal, codes.Unknown) -> 500
      // Uses google.golang.org/grpc/status.FromError to extract the code.
    location: internal/gateway/gateway.go

  - name: Version (constant)
    description: |-
      Shared version constant extracted from all three main.go files (MIN-1).
      Package internal/version exports a single const.
    definition: |-
      package version

      const Version = "1.3.0"
    location: internal/version/version.go

waves:
  - number: 1
    agents:
      - id: I
        task: |-
          ## Agent I — Create internal/version/version.go (MIN-1)

          Create the file `internal/version/version.go` with the following exact content:

          ```go
          // Package version provides the shared version string for all server binaries.
          package version

          // Version is the current release version of the GCP Secret Manager Emulator.
          const Version = "1.3.0"
          ```

          No other changes. This file will be imported by cmd/server/main.go,
          cmd/server-rest/main.go, and cmd/server-dual/main.go in Wave 3 (Agent G, H).

          ### Verification gate
          ```
          go build ./internal/version/...
          go vet ./internal/version/...
          go test ./internal/version/...
          ```
          (The package has no test file; go test will report "no test files" which is fine.)
        files:
          - internal/version/version.go
        dependencies: []

      - id: A
        task: |-
          ## Agent A — Storage layer correctness fixes

          File: `internal/server/storage.go`

          Apply the following fixes in order. Read the file carefully before editing.

          ### BUG-1: DestroySecretVersion must return FailedPrecondition for already-DESTROYED

          In `DestroySecretVersion`, around lines 604-611, the code currently returns success
          when the version is already DESTROYED. Change it to return FailedPrecondition:

          ```go
          // Replace:
          if version.State == secretmanagerpb.SecretVersion_DESTROYED {
              return &secretmanagerpb.SecretVersion{...}, nil  // success
          }

          // With:
          if version.State == secretmanagerpb.SecretVersion_DESTROYED {
              return nil, status.Errorf(codes.FailedPrecondition,
                  "Secret Version is in an invalid state for this operation")
          }
          ```

          ### BUG-6: resolveLatestVersion — fix 0-sentinel bug and add found bool

          Replace the entire `resolveLatestVersion` function body. The current code uses
          `latestVersionNum == 0` as a sentinel for "no enabled versions found", which is
          incorrect if Sscanf fails and num stays 0. Also, when versions exist but none
          are ENABLED, it should return FailedPrecondition (GAP-13), not NotFound.

          New implementation:

          ```go
          func (s *Storage) resolveLatestVersion(stored *StoredSecret) (string, error) {
              var latestVersionNum int64
              var found bool

              for versionID, version := range stored.Versions {
                  if version.State != secretmanagerpb.SecretVersion_ENABLED {
                      continue
                  }
                  var num int64
                  if _, err := fmt.Sscanf(versionID, "%d", &num); err != nil {
                      continue // skip malformed version IDs
                  }
                  if !found || num > latestVersionNum {
                      latestVersionNum = num
                      found = true
                  }
              }

              if !found {
                  // Distinguish: are there any versions at all?
                  if len(stored.Versions) == 0 {
                      return "", status.Errorf(codes.NotFound,
                          "No versions found for secret [%s]", stored.Name)
                  }
                  return "", status.Errorf(codes.FailedPrecondition,
                      "No enabled versions found for secret [%s]", stored.Name)
              }

              return fmt.Sprintf("%d", latestVersionNum), nil
          }
          ```

          ### GAP-1: Add resolveLatestVersionAny for GetSecretVersion

          Add a new function after `resolveLatestVersion`. This function finds the
          highest-numbered version regardless of state, for use by `GetSecretVersion("latest")`:

          ```go
          // resolveLatestVersionAny finds the highest version number regardless of state.
          // Used by GetSecretVersion where "latest" should resolve to any version state.
          // Must be called with read lock held.
          func (s *Storage) resolveLatestVersionAny(stored *StoredSecret) (string, error) {
              var latestVersionNum int64
              var found bool

              for versionID := range stored.Versions {
                  var num int64
                  if _, err := fmt.Sscanf(versionID, "%d", &num); err != nil {
                      continue
                  }
                  if !found || num > latestVersionNum {
                      latestVersionNum = num
                      found = true
                  }
              }

              if !found {
                  return "", status.Errorf(codes.NotFound,
                      "No versions found for secret [%s]", stored.Name)
              }

              return fmt.Sprintf("%d", latestVersionNum), nil
          }
          ```

          Then update `GetSecretVersion` to call `resolveLatestVersionAny` instead of
          `resolveLatestVersion` when `versionID == "latest"` (around lines 359-365):

          ```go
          if versionID == "latest" {
              latestID, err := s.resolveLatestVersionAny(stored)
              if err != nil {
                  return nil, err
              }
              versionID = latestID
              versionName = fmt.Sprintf("%s/versions/%s", secretName, versionID)
          }
          ```

          `AccessSecretVersion` continues to call `resolveLatestVersion` (ENABLED-only) —
          do not change it.

          ### GAP-10: DisableSecretVersion must return FailedPrecondition for already-DISABLED

          In `DisableSecretVersion`, after the DESTROYED check (around line 519-521), add:

          ```go
          // After the DESTROYED check, before setting state:
          if version.State == secretmanagerpb.SecretVersion_DISABLED {
              return nil, status.Errorf(codes.FailedPrecondition,
                  "Secret Version is in an invalid state for this operation")
          }
          ```

          ### GAP-11: EnableSecretVersion must return FailedPrecondition for already-ENABLED

          In `EnableSecretVersion`, after the DESTROYED check (around line 562-564), add:

          ```go
          if version.State == secretmanagerpb.SecretVersion_ENABLED {
              return nil, status.Errorf(codes.FailedPrecondition,
                  "Secret Version is in an invalid state for this operation")
          }
          ```

          ### GAP-3: parseStateFilter must return (map, error)

          Change the signature of `parseStateFilter` to return an error for unknown state tokens:

          ```go
          func parseStateFilter(filter string) (map[secretmanagerpb.SecretVersion_State]bool, error) {
              if filter == "" {
                  return nil, nil
              }

              filter = strings.TrimSpace(filter)

              if strings.HasPrefix(filter, "state:") {
                  stateName := strings.TrimPrefix(filter, "state:")
                  stateName = strings.TrimSpace(stateName)

                  includeStates := make(map[secretmanagerpb.SecretVersion_State]bool)
                  switch strings.ToUpper(stateName) {
                  case "ENABLED":
                      includeStates[secretmanagerpb.SecretVersion_ENABLED] = true
                  case "DISABLED":
                      includeStates[secretmanagerpb.SecretVersion_DISABLED] = true
                  case "DESTROYED":
                      includeStates[secretmanagerpb.SecretVersion_DESTROYED] = true
                  default:
                      return nil, status.Errorf(codes.InvalidArgument,
                          "Invalid filter state value: %q. Valid values: ENABLED, DISABLED, DESTROYED", stateName)
                  }
                  return includeStates, nil
              }

              // Non-state: prefixed filters are passed through without error (ignored).
              return nil, nil
          }
          ```

          Update the `ListSecretVersions` caller to handle the error:

          ```go
          includeStates, err := parseStateFilter(filter)
          if err != nil {
              return nil, "", err
          }
          ```

          ### Verification gate
          ```
          go build ./internal/server/...
          go vet ./internal/server/...
          go test ./internal/server/... -run TestStorage
          ```
        files:
          - internal/server/storage.go
        dependencies: []

      - id: B
        task: |-
          ## Agent B — Server layer: GAP-5 secret_id validation

          File: `internal/server/server.go`

          ### GAP-5: Validate secret_id format in CreateSecret

          Add regex validation for `secret_id` in `CreateSecret`. The field must match
          `^[a-zA-Z0-9_-]{1,255}$`.

          Add the following import (add `"regexp"` to the import block):
          ```go
          "regexp"
          ```

          Add a package-level variable after the imports:
          ```go
          var validSecretIDRegexp = regexp.MustCompile(`^[a-zA-Z0-9_-]{1,255}$`)
          ```

          In `CreateSecret`, after the existing `req.GetSecretId() == ""` check and before
          the `checkPermission` call, add:

          ```go
          if !validSecretIDRegexp.MatchString(req.GetSecretId()) {
              return nil, status.Errorf(codes.InvalidArgument,
                  "Secret ID [%s] must match pattern [a-zA-Z0-9_-]{1,255}", req.GetSecretId())
          }
          ```

          The full validation block in CreateSecret should read:
          ```go
          if req.GetParent() == "" {
              return nil, status.Error(codes.InvalidArgument, "parent is required")
          }
          if req.GetSecretId() == "" {
              return nil, status.Error(codes.InvalidArgument, "secret_id is required")
          }
          if !validSecretIDRegexp.MatchString(req.GetSecretId()) {
              return nil, status.Errorf(codes.InvalidArgument,
                  "Secret ID [%s] must match pattern [a-zA-Z0-9_-]{1,255}", req.GetSecretId())
          }
          if req.GetSecret() == nil {
              return nil, status.Error(codes.InvalidArgument, "secret is required")
          }
          ```

          No other changes to this file.

          ### Verification gate
          ```
