title: 'Correctness Fixes: Storage, Gateway, and Minor Cleanup'
feature_slug: correctness-fixes
verdict: SUITABLE
suitability_assessment: |-
  All 19 findings are confirmed bugs and correctness gaps in the existing codebase.
  File decomposition is clean: 9 agents across 3 waves with fully disjoint ownership.
  Interfaces are discoverable (parseStateFilter signature change, NewServer signature change,
  resolveLatestVersionAny addition) and can be specified before implementation.
  No investigation-first work is required.

  Wave structure:
  - Wave 1 (5 parallel agents): Foundation changes in storage.go, server.go, version.go,
    storage_coverage_test.go, server_coverage_test.go. Agents A/B/I are independent;
    C depends on A's storage.go changes; D depends on B's server.go changes.
    Since C and D only fix tests that assert wrong behavior, they can be authored in
    Wave 1 alongside A and B because the test changes are already fully specified by
    the findings — agents C and D know exactly what assertions to flip.
  - Wave 2 (1 agent): gateway.go — BUG-2 through BUG-5, GAP-8, GAP-9, MIN-3, MIN-4,
    MIN-6. Depends on Wave 1 completing (version.go from Agent I is imported).
  - Wave 3 (2 parallel agents): gateway_test.go and cmd main files — depend on Wave 2's
    NewServer(*Server, error) signature and grpcStatusToHTTP helper being stable.

  Parallelization value: HIGH. Build+test cycle is go test ./... on a Go module with
  gRPC integration tests. Estimated 30-60 seconds per agent cycle. 9 agents with
  non-trivial logic changes across 14 files.

  Estimated times:
  - Scout phase: ~10 min
  - Agent execution: Wave 1 ~5 agents x 12 min avg = 12 min wall time (parallel);
    Wave 2 ~1 agent x 15 min; Wave 3 ~2 agents x 10 min = 10 min wall time
  - Merge and verification: ~5 min
  Total SAW time: ~52 min
  Sequential baseline: ~9 agents x 15 min avg = 135 min
  Time savings: ~83 min (62% faster)
