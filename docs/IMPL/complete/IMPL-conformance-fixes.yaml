            func buildSecretProto(stored *StoredSecret) *secretmanagerpb.Secret {
                // Convert map[string]int64 to map[string]int32 for proto
                var aliases map[string]int32
                if len(stored.VersionAliases) > 0 {
                    aliases = make(map[string]int32, len(stored.VersionAliases))
                    for k, v := range stored.VersionAliases {
                        aliases[k] = int32(v)
                    }
                }
                return &secretmanagerpb.Secret{
                    Name:           stored.Name,
                    CreateTime:     stored.CreateTime,
                    Labels:         stored.Labels,
                    Annotations:    stored.Annotations,
                    Replication:    stored.Replication,
                    Etag:           stored.Etag,
                    VersionAliases: aliases,
