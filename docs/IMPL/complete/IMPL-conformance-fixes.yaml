            func TestStorage_EtagGeneration(t *testing.T) {
                s := NewStorage()
                ctx := context.Background()

                secret, err := s.CreateSecret(ctx, "projects/p", "s1", &secretmanagerpb.Secret{})
                if err != nil {
                    t.Fatalf("CreateSecret: %v", err)
