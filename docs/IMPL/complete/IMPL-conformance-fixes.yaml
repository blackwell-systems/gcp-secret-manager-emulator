                    CreateTime: version.CreateTime,
                    State:      version.State,
                    Etag:       version.Etag,
                }
                if version.State == secretmanagerpb.SecretVersion_DESTROYED && version.DestroyTime != nil {
                    sv.DestroyTime = version.DestroyTime
