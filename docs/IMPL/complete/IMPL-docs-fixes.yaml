pre_mortem:
    overall_risk: low
    rows:
        - scenario: Agent B replaces docs/CHANGELOG.md by reading the root CHANGELOG.md and writing the content. If the agent reads the root file incorrectly or truncates it, the docs CHANGELOG may end up partial or empty.
          likelihood: low
          impact: medium
          mitigation: The verification gate requires diff /CHANGELOG.md docs/CHANGELOG.md to produce no output. If the agent's write is incomplete, diff will catch it immediately.
        - scenario: Agent F expands the Error Codes table but mistakenly removes an existing row while inserting PermissionDenied, leaving fewer than 5 original entries.
          likelihood: low
          impact: low
          mitigation: 'Verification gate grep count can be augmented: the agent should confirm all 5 original codes (InvalidArgument, NotFound, AlreadyExists, FailedPrecondition, Unimplemented) still appear after the edit.'
        - scenario: Agent G removes the Contributing link from the sidebar but leaves a dangling table-of-contents entry inside API-REFERENCE.md that references a non-existent section heading. This is pre-existing and is not Agent G's responsibility to fix, but reviewers may flag it post-merge.
          likelihood: medium
          impact: low
          mitigation: Document as a known pre-existing issue. A follow-up task can remove the stale table-of-contents entry from API-REFERENCE.md if desired.
        - scenario: Agent D restructures docs/ROADMAP.md version sections in a way that loses the existing Future Considerations or Contributing Ideas prose.
          likelihood: low
          impact: low
          mitigation: Agent brief explicitly says to preserve those sections. Verification grep checks confirm the version entries are present. A final manual review of ROADMAP.md before merge is recommended.
        - scenario: Two agents (e.g., B and C) are launched concurrently in the same worktree and accidentally overwrite each other's file changes if worktree isolation is not enforced correctly.
          likelihood: low
          impact: medium
          mitigation: File ownership is fully disjoint. Each agent owns a distinct set of files with no overlap. Worktree isolation enforces this at the filesystem level. No two agents in this wave touch the same file.
