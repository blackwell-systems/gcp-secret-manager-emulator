            **Line 30:** `[Contributing](API-REFERENCE.md#contributing)` — DO NOT CHANGE. The heading exists at line 1317 of docs/API-REFERENCE.md and the anchor is valid.

            ## Mermaid version pin in docs/index.html

            Find: `<script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js">`
            Replace with: `<script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js">`

            ## Verification
