interface_contracts:
    - name: NewServer
      description: |-
        Returns (*Server, error) instead of *Server. Callers must handle the
        error and call log.Fatalf on non-nil err. This is the only cross-agent
        boundary — Agent F and Agent G both consume this new signature.
      definition: |
        func NewServer(grpcAddr string) (*Server, error)
      location: internal/gateway/gateway.go
    - name: grpcStatusToHTTP
      description: |-
        Package-level helper that maps a gRPC status error to the correct HTTP
        status code. Used by all error paths in gateway.go. Not exported; only
        consumed within the same file.
      definition: |
        func grpcStatusToHTTP(err error) int
        // codes.NotFound        -> 404
        // codes.AlreadyExists   -> 409
        // codes.InvalidArgument -> 400
        // codes.FailedPrecondition -> 400
        // codes.PermissionDenied -> 403
        // codes.Unauthenticated -> 401
        // default               -> 500
      location: internal/gateway/gateway.go
waves:
    - number: 1
      agents:
        - id: E
          task: |
            ## Role
            Fix all four confirmed bugs in internal/gateway/gateway.go.

            ## What to implement

            ### BUG-1: updateSecret — forward update_mask query parameter
            In `updateSecret()` (around line 301), after parsing the request body,
            read the `update_mask` query parameter:

            ```go
            updateMaskStr := r.URL.Query().Get("update_mask")
            ```

            If non-empty, construct a FieldMask and set it on the request:

            ```go
            import "google.golang.org/protobuf/types/known/fieldmaskpb"

            var mask *fieldmaskpb.FieldMask
            if updateMaskStr != "" {
                mask = &fieldmaskpb.FieldMask{Paths: strings.Split(updateMaskStr, ",")}
            }

            req := &secretmanagerpb.UpdateSecretRequest{
                Secret:     &secret,
                UpdateMask: mask,
            }
            ```

            Also replace the `http.StatusInternalServerError` in updateSecret's
            error path with `grpcStatusToHTTP(err)` (see BUG-2 below).

            ### BUG-2: add grpcStatusToHTTP helper and replace all 500 hardcodes
            Add this package-level helper near the top of the file (after the
            Server struct, before the handlers):

            ```go
            import (
                "google.golang.org/grpc/codes"
                "google.golang.org/grpc/status"
            )

            func grpcStatusToHTTP(err error) int {
                if err == nil {
                    return http.StatusOK
                }
                st, ok := status.FromError(err)
                if !ok {
                    return http.StatusInternalServerError
                }
                switch st.Code() {
                case codes.NotFound:
                    return http.StatusNotFound
                case codes.AlreadyExists:
                    return http.StatusConflict
                case codes.InvalidArgument, codes.FailedPrecondition:
                    return http.StatusBadRequest
                case codes.PermissionDenied:
                    return http.StatusForbidden
                case codes.Unauthenticated:
                    return http.StatusUnauthorized
                default:
                    return http.StatusInternalServerError
                }
            }
            ```

            Replace every `http.StatusInternalServerError` that follows an `err`
            returned from a gRPC client call with `grpcStatusToHTTP(err)`. Do NOT
            replace the 500s in writeProtoJSON (those are local marshal errors, not
            gRPC errors). Affected functions:
            - listSecrets
            - createSecret
            - updateSecret
            - deleteSecret
            - addSecretVersion
            - listSecretVersions
            - accessSecretVersion
            - enableSecretVersion
            - disableSecretVersion
            - destroySecretVersion

            ### BUG-3: getSecret and getSecretVersion replace hardcoded 404
            In `getSecret()` (line 282), change:
              `http.StatusNotFound` → `grpcStatusToHTTP(err)`

            In `getSecretVersion()` (line 386), change:
              `http.StatusNotFound` → `grpcStatusToHTTP(err)`

            ### BUG-4: NewServer returns (*Server, error) instead of panicking
            Change the function signature from:
              `func NewServer(grpcAddr string) *Server`
            to:
              `func NewServer(grpcAddr string) (*Server, error)`

            Replace the panic with a returned error:
            ```go
            if err != nil {
                return nil, fmt.Errorf("failed to dial gRPC server: %w", err)
            }
            return &Server{
                grpcClient: secretmanagerpb.NewSecretManagerServiceClient(conn),
                conn:       conn,
            }, nil
            ```

            ## Imports
            Add to the import block:
            - `"google.golang.org/grpc/codes"`
            - `"google.golang.org/grpc/status"`
            - `"google.golang.org/protobuf/types/known/fieldmaskpb"`

            Both grpc/codes and grpc/status are already indirect dependencies via
            google.golang.org/grpc v1.78.0 in go.mod. fieldmaskpb is part of
            google.golang.org/protobuf v1.36.11, already a direct dependency.
            No go.mod changes are needed.

            ## Verification gate
            ```
            gofmt -l internal/gateway/gateway.go
            go build ./...
            go vet ./...
            go test ./internal/gateway/...
            ```

            ## Constraints
            - Do not modify gateway_test.go — that is Agent F's file.
            - Do not modify any cmd/ files — that is Agent G's file.
            - Do not replace the http.StatusInternalServerError inside writeProtoJSON;
              those are marshal errors unrelated to gRPC status codes.
            - Run gofmt on the file before finishing; CI enforces formatting.
          files:
            - internal/gateway/gateway.go
