suitability_assessment: |
    All four bugs are confirmed in internal/gateway/gateway.go with exact line
    references and known fixes. No root-cause investigation is needed.

    File decomposition: 4 distinct files change across 3 agents with disjoint
    ownership. Wave 1 has a single agent (E) owning gateway.go — the only file
    with all four bugs. Wave 2 parallelizes two agents: F owns gateway_test.go
    and G owns the two cmd entry points. No two agents in the same wave touch
    the same file.

    Interface contract: BUG-4 changes NewServer from `func NewServer(grpcAddr string)
    *Server` to `func NewServer(grpcAddr string) (*Server, error)`. This is the
    single cross-agent boundary. Agent F (tests) and Agent G (cmd mains) both
    depend on this new signature, so they are in Wave 2 after Agent E completes.

    Interface discoverability: the new signature is fully specifiable before
    implementation starts — no unknowns.

    Parallelization value: build+test cycle for a Go project with integration-style
    gateway tests is moderate (~15-30s). Wave 2 runs two agents in parallel, each
    touching separate files. Clear benefit over sequential execution.

    Pre-implementation check:
    - BUG-1 (update_mask): TODO — UpdateSecretRequest built with no UpdateMask field.
    - BUG-2 (gRPC→HTTP mapping): TODO — every error handler uses http.StatusInternalServerError.
    - BUG-3 (getSecret/getSecretVersion hardcode 404): TODO — confirmed at lines 282 and 386.
    - BUG-4 (NewServer panic): TODO — confirmed panic at line 38.

    gateway_test.go already exists as an untracked file. The test at line 249
    explicitly documents the BUG-1/BUG-2 breakage (expects 500 with a comment
    explaining why). Agent F must update that test to assert 200 after the fix,
    plus add grpcStatusToHTTP coverage.

    Estimated times:
    - Scout phase: ~8 min
    - Agent execution: Wave 1 ~15 min (1 agent, ~10 file edits); Wave 2 ~10 min
      (2 parallel agents, 3 files total)
    - Merge and verification: ~3 min
    Total SAW time: ~36 min

    Sequential baseline: ~40 min (3 agents × ~13 min avg sequential)
    Time savings: ~4 min (marginal speed gain; primary value is coordination and
    interface spec clarity across the three-file update).
