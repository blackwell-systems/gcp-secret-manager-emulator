pre_mortem:
    overall_risk: low
    rows:
        - scenario: |-
            Agent F updates TestUpdateSecret/Success to send update_mask=labels but
            the gRPC server rejects the mask value for a reason not covered in the bug
            report (e.g., unknown field path). Test would still fail after fix.
          likelihood: low
          impact: medium
          mitigation: |-
            Agent F should read server.go line 164 and the UpdateSecret handler to
            confirm which field paths are accepted before writing the assertion. If the
            server validates paths strictly, use a known-valid path such as "labels".
        - scenario: |-
            Agent G uses := instead of = for the err variable on the NewServer call,
            causing a compile error ("no new variables on left side of :=") because
            err is already declared in the same scope.
          likelihood: medium
          impact: low
          mitigation: |-
            Agent G task prompt explicitly calls out this scoping issue and instructs
            use of plain assignment =. Verification gate (`go build ./cmd/...`) will
            catch this before the agent reports completion.
        - scenario: |-
            gofmt CI gate fails because one agent forgets to run gofmt before
            finishing. The post-merge `gofmt -l .` gate will catch this but block
            the merge.
          likelihood: low
          impact: low
          mitigation: |-
            Each agent's verification gate includes `gofmt -l <file>` as the first
            step. Orchestrator runs `gofmt -l .` post-merge as a quality gate.
        - scenario: |-
            fieldmaskpb import is not resolved because go.sum is stale or the
            indirect dependency is not actually available as a direct import.
          likelihood: low
          impact: medium
          mitigation: |-
            fieldmaskpb is part of google.golang.org/protobuf which is already a
            direct dependency in go.mod v1.36.11. No go get needed. Agent E's
            verification gate (`go build ./...`) will surface any import issue
            immediately.
